[project]
name = "trivia-service"
version = "0.1.0"
description = "Standalone trivia question generation, fact-checking, and storage service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6",
    "anthropic>=0.39",
    "openai>=1.60",  # needs the Responses API for the native web_search tool
    "google-genai>=0.3",
    "httpx>=0.27",
    "sentence-transformers>=3.3",
    "numpy>=2.1",
    "alembic>=1.14",
    "aiosqlite>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
